# =============================================================================
# SHOPPING KNOWLEDGE BASE - Andorinha Hiper Center
# =============================================================================
# Gerado a partir de 10 pedidos (ago/2025 a mai/2026)
#
# INSTRUÇÕES PARA O AGENTE:
# 1. Quando um item da lista de compras corresponder ao campo `generic`, use
#    `preferred_brand` para especificar a marca no carrinho.
# 2. Se `preferred_brand` for null, qualquer marca da `alternate_brands` serve.
# 3. Se `rotation: true`, a marca não importa - varie livremente.
# 4. O household tem `lactose_free: true` como regra global. Para qualquer
#    produto lácteo (leite, creme de leite, leite condensado, iogurte), prefira
#    sempre a versão sem lactose (SL). O campo `lactose_free: true` no produto
#    indica que essa regra já está aplicada.
# 5. Use `typical_qty` como quantidade sugerida. Para itens em kg, é a média
#    observada — ajuste conforme contexto da lista.
# 6. Itens com `restock_cycle: monthly` aparecem em quase todo pedido grande.
#    Se não estiverem na lista mas forem `monthly` + `frequency: always`,
#    considere sugerir proativamente.
# 7. `seasonal: true` = item comprado apenas em época específica (ex: Natal).
#    Não sugira fora de contexto.
# 8. `orders_count` = em quantos dos 10 pedidos analisados o item apareceu.
# =============================================================================

meta:
  generated: "2026-06-02"
  orders_analyzed: 10
  # Os 8 pedidos principais cobrem out/2025 a mai/2026
  date_range: "2025-08 a 2026-05"
  avg_order_value_brl: 1807
  avg_order_items: 83
  avg_frequency_days: 30
  store: "Andorinha Hiper Center Online"

household:
  lactose_free: true  # preferência familiar global — sempre preferir versão SL em laticínios
  modality_preference: "entrega"  # mas ocasionalmente faz retirada na loja

# Escala de frequência:
# always:     9-10/10 pedidos
# frequent:   6-8/10 pedidos
# occasional: 3-5/10 pedidos
# rare:       1-2/10 pedidos


# =============================================================================
# CONFIG — thresholds e parâmetros ajustáveis pelo orchestrator
# =============================================================================
config:
  dominance_threshold_pct: 15      # alternativa precisa ser ≥X% mais barata/unit pra escalar p/ LLM
  pack_optimization: true          # tentar combinar embalagens menores se reduzir custo total
  max_packs_per_item: 6            # teto só no pack-opt (ceil(qty/unit_count)); qty explícita da lista não é cortada
  llm_model: "grok-4.6"            # ids válidos: grok-4.6 (default), grok-4.5
  llm_timeout_s: 120               # timeout do subprocess `claude -p` (10s overhead + ~10s/call)
  enrichment:
    match_threshold: 0.55          # fuzzy match score mínimo (difflib) — 0.45 gerava Maizena→Oreo
  browser:
    cdp_url: "http://localhost:9222"
    click_settle_ms: 1200          # espera após cada clique — o servidor do Andorinha não acompanha UI otimista
    nav_timeout_ms: 15000

