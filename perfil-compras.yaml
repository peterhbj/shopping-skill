# =============================================================================
# PADRAO DE COMPRA / CONTEXTO PARA O AGENTE
# =============================================================================
shopping_patterns:
  always_buy_together:
    - ["linguiça toscana", "linguiça calabresa", "bacon"]
    - ["refrigerante bioleve zero limão", "refrigerante bioleve zero mexerica"]
    - ["queijo mussarela fatiado", "presunto fatiado"]
    - ["molho de tomate sachê", "macarrão parafuso", "macarrão espaguete"]
    - ["água mineral com gás", "suco maguary maçã caixinha"]

  always_buy_in_volume:
    - item: "papel higiênico"
      note: "nunca menos que 1 pacote grande (C/16+)"
    - item: "suco maguary maçã caixinha"
      note: "mínimo 15 caixinhas"
    - item: "água mineral com gás"
      note: "mínimo 12 garrafas"
    - item: "atum natural"
      note: "mínimo 4 latas"
    - item: "molho de tomate sachê"
      note: "mínimo 10 sachês"
    - item: "bolinho ana maria gotas chocolate"
      note: "sempre 10 unidades"
    - item: "saco de lixo banheiro"
      note: "sempre múltiplos pacotes"

  lactose_free_substitution_rules:
    - "leite → sempre Ninho Levinho Semidesnatado S/Lactose"
    - "creme de leite → preferir Italac Zero Lactose"
    - "leite condensado → preferir Italac S/Lactose"
